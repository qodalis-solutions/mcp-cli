name: Publish to npm

on:
  push:
    branches: [main]

# Publishes the package when its version is not on npm yet. Uses the NPM_TOKEN
# secret when present and falls back to npm trusted publishing (OIDC via
# id-token: write) otherwise.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Use the latest npm
        run: npm install -g npm@latest && node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build, typecheck and test
        run: |
          npm run build
          npm run typecheck
          npm test
          bash scripts/check-packed.sh

      - name: Publish if this version is not on npm yet
        # `npm view` reads from eventually-consistent replicas, so a merge that
        # lands minutes after a release can still see 404 for a version that is
        # already published. The publish itself is authoritative: a 409
        # "previously staged version" means it is there, and is not a failure.
        run: |
          set -eo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping."
            exit 0
          fi
          echo "::group::Publishing $name@$version"
          if npm publish --access public --provenance 2>&1 | tee publish.log; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          if grep -qE "E409|previously staged version|cannot publish over" publish.log; then
            echo "$name@$version already exists on the registry (409 after replica lag); treating as published."
            exit 0
          fi
          echo "::error::Publishing $name@$version failed."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
